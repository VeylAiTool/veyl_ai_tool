            background-size: 600px 600px;
            color: #ffffff; 
            font-family: 'Inter', Tahoma, Arial, sans-serif; 
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(13, 13, 13, 0.65); /* تعتيم أخف بكثير لإظهار الأشكال */
        }
    </style>
</head>
<body>
    <div class="app-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="background: {% if category == 'error' %}#f44336{% else %}#0d9488{% endif %}; color: white; padding: 10px; text-align: center; font-size: 14px; position: absolute; top: 0; left: 0; right: 0; z-index: 999;">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
